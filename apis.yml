name: LastDatabase
aid: lastdatabase
description: 'LastDatabase is a B2B and consumer contact-data marketplace selling email, phone and fax lead lists
  organised by country, industry, category and job title, plus data enrichment and email verification. Developers
  reach it two ways: the Lead Search API, a single Bearer-key REST endpoint (GET /api/leads/search) filterable by
  type, country, city, industry, keyword and limit, sold on Free, Pro and Enterprise daily-request plans; and an
  OAuth-protected remote MCP server at lastdatabase.com/mcp exposing search_people, unlock_people, verify_email
  and get_credits tools gated by scopes. It publishes an OpenAPI 3.1 document, an llms.txt, a public Postman collection
  and a Trust Center claiming ISO/IEC 27001.'
